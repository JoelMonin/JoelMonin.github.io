<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Casa Somba</title>
<link rel="icon" type="image/svg+xml" href="/logo/casa-somba-symbole.svg">
<link rel="stylesheet" href="/polices.css">
<style>
body { margin: 0; min-height: 100vh; display: flex; align-items: center;
       justify-content: center; background: #fff; color: #2e2b26;
       font-family: system-ui, sans-serif; }
ul { list-style: none; padding: 0; display: flex; gap: 22px; flex-wrap: wrap;
     justify-content: center; }
a { color: inherit; font-size: 1.2rem; }
</style>
</head>
<body>
  <ul>
    <li><a href="/fr/" lang="fr" hreflang="fr">Français</a></li>
    <li><a href="/en/" lang="en" hreflang="en">English</a></li>
    <li><a href="/nl/" lang="nl" hreflang="nl">Nederlands</a></li>
    <li><a href="/de/" lang="de" hreflang="de">Deutsch</a></li>
  </ul>
<script>
  // La langue déclarée par le navigateur, si le site la parle ; sinon le repli.
  var parlees = ["fr", "en", "nl", "de"];
  var accueils = {"fr": "/fr/", "en": "/en/", "nl": "/nl/", "de": "/de/"};
  var vue = (navigator.language || "").slice(0, 2).toLowerCase();
  location.replace(parlees.indexOf(vue) >= 0 ? accueils[vue] : "/en/");
</script>
</body>
</html>
